<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>YouTube Loudness</h1>

    <!-- ステータス表示（停止中 / 計測中 / エラー） -->
    <div id="status" class="status status--idle">
      <span id="status-text">停止中</span>
    </div>

    <!-- 計測開始/停止ボタン -->
    <button id="toggle-btn" class="btn">計測開始</button>

    <!-- メーター表示エリア（計測中のみ表示） -->
    <div id="meters" class="meters hidden">

      <!-- Momentary LUFS: 400msウィンドウの瞬時ラウドネス -->
      <div class="meter-group">
        <div class="meter-header">
          <span class="meter-label">
            Momentary LUFS
            <span class="help-tip" data-tip="直近0.4秒の瞬時音量。急な爆音やピークを捉える">?</span>
          </span>
          <span class="meter-value" id="momentary-value">--.-- LUFS</span>
        </div>
        <div class="meter-bar-container">
          <div class="meter-bar" id="momentary-bar"></div>
          <div class="meter-scale">
            <span>-60</span><span>-36</span><span>-24</span><span>-14</span><span>0</span>
          </div>
        </div>
      </div>

      <!-- Short-term LUFS: 3秒ウィンドウの短期ラウドネス -->
      <div class="meter-group">
        <div class="meter-header">
          <span class="meter-label">
            Short-term LUFS
            <span class="help-tip" data-tip="直近3秒の平均音量。体感的な「今の音量」に近い">?</span>
          </span>
          <span class="meter-value" id="shortterm-value">--.-- LUFS</span>
        </div>
        <div class="meter-bar-container">
          <div class="meter-bar" id="shortterm-bar"></div>
          <div class="meter-scale">
            <span>-60</span><span>-36</span><span>-24</span><span>-14</span><span>0</span>
          </div>
        </div>
      </div>

      <!-- RMS: 400msウィンドウのRMSレベル（K-weightingなし） -->
      <div class="meter-group">
        <div class="meter-header">
          <span class="meter-label">
            RMS
            <span class="help-tip" data-tip="聴覚補正なしの信号レベル（0.4秒）。LUFSとの差で音の周波数バランスがわかる">?</span>
          </span>
          <span class="meter-value" id="rms-value">--.-- dBFS</span>
        </div>
        <div class="meter-bar-container">
          <div class="meter-bar meter-bar--rms" id="rms-bar"></div>
          <div class="meter-scale">
            <span>-60</span><span>-36</span><span>-24</span><span>-14</span><span>0</span>
          </div>
        </div>
      </div>

      <!-- YouTubeのラウドネス正規化ターゲット値 -->
      <div class="reference-info">
        <span class="reference-label">YouTube Target:</span>
        <span class="reference-value">-14 LUFS</span>
        <span class="help-tip" data-tip="YouTubeはこの値より大きい動画の音量を自動で下げる。小さい動画はそのまま再生される">?</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
